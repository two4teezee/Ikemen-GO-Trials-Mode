; -- IKEMEN GO TRIALS MODE EXTERNAL MODULE --------------------------------
; ---- config.ini - player preferences for the Trials module.
; ---- This file is rewritten by the module when the player changes any 
; ---- of the options in the Trials pause menu.
; --
; -- Module developed by two4teezee
; -------------------------------------------------------------------------

; Advancement    : autoadvance | repeat  - move to the next Trial on Success, or replay this one
; Layout         : vertical | horizontal - how the Steps are arranged on screen
; ResetOnSuccess : true | false          - recentre the pair after a Trial is cleared
; Textboxes      : show | hide           - show a Trial's explanatory text, where it has any
; TotalTimer     : true | false          - show the run timer
; TrialTimer     : true | false          - show the current Trial's timer

[Options]
Trials.Advancement    = autoadvance
Trials.Layout         = vertical
Trials.ResetOnSuccess = false
Trials.Textboxes      = show
Trials.TotalTimer     = true
Trials.TrialTimer     = true
