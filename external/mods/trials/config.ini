; TRIALS MODE — module configuration
;
; Read by the module with loadIni. Not read by the engine.

[Common]
; NOT YET WIRED (issue #35). Once implemented, the module injects these per-match by
; mutating the `common` table in the launchFight hook, so installing trials will never
; require editing save/config.ini. Until then trials.zss is not loaded and a Trials
; match runs with no trials state code.
States = external/mods/trials/trials.zss

[Files]
defaults = external/mods/trials/system.def

[Options]
; Player Preferences. These are the settings the player changes from the trials pause
; menu, and the module writes this section back with saveIni when they do. Authored
; presentation belongs in system.def, not here — see docs/adr/0001.
Trials.Advancement     = autoadvance
Trials.Layout          = vertical
Trials.ResetOnSuccess  = false
Trials.Textboxes       = show
Trials.TotalTimer      = true
Trials.TrialTimer      = true
