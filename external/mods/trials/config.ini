; -- IKEMEN GO TRIALS MODE EXTERNAL MODULE --------------------------------
; ---- config.ini - default behaviour and saved player preferences.
; --
; ---- The values shipped here are the mode's defaults. The Trials pause
; ---- menu rewrites this file the moment a player changes one of the
; ---- options, and that saved choice wins on the next launch. Screenpack
; ---- authors set their pack's defaults by editing the values below.
; ---- Note: the module rewrites this file without these comments, so the
; ---- legend below is lost once the player changes anything in the menu.
; --
; -- Module developed by two4teezee
; -------------------------------------------------------------------------

; Advancement    : autoadvance | repeat  - on Success, move to the next Trial or replay this one
; Layout         : vertical | horizontal - how the Steps are arranged on screen. Also selects the
;                                          scrolling behaviour and enables dynamic step width.
;                                          Switchable mid-match from the pause menu.
; ResetOnSuccess : true | false          - recentre the pair after each Trial is cleared (except
;                                          the last one). system.def's fadein/fadeout style the
;                                          transition.
; Textboxes      : show | hide           - show a Trial's explanatory text, where it has any
; TotalTimer     : true | false          - show the run timer
; TrialTimer     : true | false          - show the current Trial's timer

[Options]
Trials.Advancement    = autoadvance
Trials.Layout         = vertical
Trials.ResetOnSuccess = false
Trials.Textboxes      = show
Trials.TotalTimer     = true
Trials.TrialTimer     = true
