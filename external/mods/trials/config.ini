; TRIALS MODE — module configuration
;
; Read by the module with loadIni. Not read by the engine.

[Common]
; Injected per-match by the module, by mutating the `common` table in the launchFight
; hook. The engine adds these before the match and removes them after, so installing
; trials never requires editing save/config.ini.
States = external/mods/trials/trials.zss

[Files]
defaults = external/mods/trials/system.def

[Options]
; Player Preferences. These are the settings the player changes from the trials pause
; menu, and the module writes this section back with saveIni when they do. Authored
; presentation belongs in system.def, not here — see docs/adr/0001.
;
; saveIni rewrites this whole file from the table it was read into. Every value above
; survives that; none of the comments do. So the first preference a player changes is
; what strips this file of its documentation, and the copy in the repository is the one
; to read.
;
; Trials.Layout is which arrangement the Steps are drawn in: `vertical` stacks them in a
; column, `horizontal` flows them along a row and wraps to the next when one runs out.
; Each has its own configuration block in system.def, both are built when the module
; loads, and switching between them from the pause menu re-lays out the Trial already on
; screen. A screenpack cannot force one — see docs/adr/0001 — it can only style both.
;
; Trials.ResetOnSuccess decides what a finished Trial does to where the two characters
; stand. On, completing one puts the pair back at the next Trial's authored positions,
; behind a fade. Off, the run carries straight on from wherever the combo ended: the next
; Trial begins in place, with no move and no fade between the two. It governs every
; Success, whether the match advances, repeats the same Trial, or reaches All-Clear.
;
; It does not govern a reposition the player asks for. The mid-Trial key combination, and
; picking a Trial out of the pause menu's list, place the pair either way.
Trials.Advancement     = autoadvance
Trials.Layout          = horizontal
Trials.ResetOnSuccess  = true
Trials.Textboxes       = show
Trials.TotalTimer      = true
Trials.TrialTimer      = true

