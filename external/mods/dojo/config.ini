; -- IKEMEN GO DOJO MODULE ------------------------------------------------
; config.ini - default behaviour and saved player preferences for Trials, 
; the Game Tutorial, Character Guides and the Combined Tutorial Modes.
;
; The pause menu edits this file when a player changes one of the options.
; Set your own defaults by editing the values below.
; 
; -- Module developed by two4teezee
; -------------------------------------------------------------------------

; [Modes] -----------------------------------------------------------------
; Trials : on | off - per-character trials (trials = trials.def in the char's def)
; SystemTutorial : on | off - teach the player your game's systems through lessons listed in [Config] SystemTutorial
; CharacterGuides : on | off - per-character lessons (tutorial = tutorial.def in the char's def). 
; CombinedTutorial : on | off - combines the system and character lessons in one list
; -------------------------------------------------------------------------
[Modes]
Trials = on
SystemTutorial = on
CharacterGuides = on
CombinedTutorial = off

; [Config] -----------------------------------------------------------------
; TrialsDummy : automatically loaded trials dummy (P2), specified the same way as select.def (e.g. kfm or kfm/kfm.def). Leave it blank to allow the player pick the dummy on the select screen. 
; TrialsStage : automatically loaded trials stage (e.g. stages/stage0.def), again specified the same way as select.def. Leave it blank to allow the player to pick the stage on the select screen.
; TutorialDummy : automatically loaded tutorial dummy (P2), specified the same way as select.def (e.g. kfm or kfm/kfm.def). Loaded for all tutorial modes; a system tutorial lesson can name its own with dummychar. Leave it blank to allow the player pick the dummy on the select screen. 
; TutorialPlayerChar : System Tutorial only - the character P1 plays the system tutorial lessons with. Alternatively, system tutorial lessons can name its own with playerchar to force a specific character. Leave this blank to allow the player to pick P1 on the select screen before the lesson list.
; TutorialStage : every tutorial mode - stage automatically loaded. Blank picks it on the select screen.
; SystemTutorial : path to system tutorial lesson files, comma-separated, relative to the Ikemen folder. They make up the Game Tutorial. A lesson narrowed with showforchars is character content: Character Guides offers it to the characters it names, and the Game Tutorial leaves it out. Leave it blank for character lessons only.
; RecordDemo : true | false - for authors, in every mode: adds Record Demo and Record Dummy to the pause menu. Your inputs are printed as a demoscript / dummyscript line and saved to save/dojo_demo.txt. Leave it false when shipping.
; TutorialDemonstrationsOnly : true | false - tutorial modes only (not Trials): lessons are shown, never played. Each one shows its instruction pages, then loops its demo; the menu's done key steps forward, cancel steps back. Every lesson needs a demoscript; lessons without one are left out.
; --------------------------------------------------------------------------
[Config]
TrialsDummy =
TrialsStage =
TutorialPlayerChar = kfm_zss
TutorialDummy = kfm_zss
TutorialStage = stages/stage0.def
SystemTutorial = external/mods/dojo/gametutorial.def
TutorialDemonstrationsOnly = false
RecordDemo = true

; [Gating] -----------------------------------------------------------------
; Trials : on | off - prevent the player from skipping ahead in the trial list. 
; SystemTutorial : on | off - prevent the player from skipping ahead in the Game Tutorial list. 
; CharacterGuides : on | off - prevent the player from skipping ahead in the Character Guides list. 
; The Combined Tutorial follows the setting of the file each lesson comes from.
; -------------------------------------------------------------------------
[Gating]
Trials = off
SystemTutorial = on
CharacterGuides = off

; [Options] -----------------------------------------------------------------
; Advancement : autoadvance | repeat  - on Success, move to the next trial / lesson or replay it
; Layout : vertical | horizontal - how the steps are arranged on screen. Switchable mid-match from the pause menu.
; ResetOnSuccess : true | false - recentre the pair after each clear (except the last one). The UI def's fadein/fadeout style the transition.
; Textboxes : show | hide - show a trial's / lesson's explanatory text, where it has any
; Hints : true | false - show a hint once the player has failed hintafter times
; TotalTimer : true | false - show the run timer
; TrialTimer : true | false - Trials: show the current trial's timer
; LessonTimer : true | false - tutorials: show the current lesson's timer
; --------------------------------------------------------------------------
[Options]
Trials.Advancement = autoadvance
Trials.Layout = vertical
Trials.ResetOnSuccess = false
Trials.Textboxes = show
Trials.Hints = true
Trials.TotalTimer = true
Trials.TrialTimer = true
Tutorial.Advancement = autoadvance
Tutorial.Layout = vertical
Tutorial.ResetOnSuccess = false
Tutorial.Textboxes = show
Tutorial.Hints = true
Tutorial.TotalTimer = true
Tutorial.LessonTimer = true
