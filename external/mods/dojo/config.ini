; -- IKEMEN GO DOJO MODULE ------------------------------------------------
; ---- config.ini - default behaviour and saved player preferences for
; ---- Trials, the Game Tutorial and Character Guides.
; --
; ---- The values shipped here are the modes' defaults. The pause menu
; ---- rewrites this file the moment a player changes one of the options,
; ---- and that saved choice wins on the next launch. Screenpack authors set
; ---- their pack's defaults by editing the values below.
; ---- Note: the module rewrites this file without these comments, so the
; ---- legend below is lost once the player changes anything in the menu.
; --
; -- Module developed by two4teezee
; -------------------------------------------------------------------------

; [Modes] - set by hand. Switches each mode on (1) or off (0). A mode that is off is hidden from
;           every menu, even when the screenpack's system.def lists it. A mode left out is on.
; Trials          : `trials` - per-character trials (trials = trials.def in the char's def)
; GameTutorial    : `tutorialgame` - the game-wide lessons listed in SystemTutorial
; CharacterGuides : `tutorialchars` - per-character lessons (tutorial = tutorial.def)
; Tutorial        : `tutorial` - game-wide and character lessons in one list, after the select screen
;
; [Config] - set by hand; the pause menu never changes these.
; TrialsChar       : Trials - character automatically loaded as the dummy (P2), given the way
;                    select.def lists it (e.g. kfm or kfm/kfm.def). Leave it blank to pick P2 on the
;                    select screen. The Trials counterpart of the engine's TrainingChar.
; TrialsStage      : Trials - stage automatically loaded (e.g. stages/stage0.def). Leave it blank to
;                    pick the stage on the select screen. The Trials counterpart of TrainingStage.
; TutorialDummy    : Game Tutorial and Character Guides - the dummy (P2), written the same way.
;                    Blank picks P2 on the select screen (or, in the Game Tutorial without a select
;                    screen, mirrors P1). Formerly TutorialChar, which is still read.
; TutorialPlayerChar : Game Tutorial only - the character P1 plays the game-wide lessons with. A
;                    lesson can name its own with lesson.playerchar. Blank picks P1 on the select
;                    screen before the lesson list.
; TutorialStage    : Game Tutorial and Character Guides - stage automatically loaded. Blank picks it
;                    on the select screen.
; SystemTutorial   : game-wide lesson files, comma-separated, relative to the Ikemen folder. They make
;                    up the Game Tutorial. A lesson narrowed with lesson.chars is character content:
;                    Character Guides offers it to the characters it names, and the Game Tutorial
;                    leaves it out. Leave it blank for character lessons only.
; RecordDemo       : true | false - for authors, in every mode: adds Record Demo and Record Dummy to the
;                    pause menu. Your inputs are printed as a demoscript / dummyscript line and saved
;                    to save/tutorial_demo.txt. Leave it false when shipping.
;
; [Options] - player preferences, one set per family: Trials.* for Trials, Tutorial.* for the Game
;             Tutorial and Character Guides.
; Advancement    : autoadvance | repeat  - on Success, move to the next trial / lesson or replay it
; Layout         : vertical | horizontal - how the steps are arranged on screen. Switchable mid-match
;                                          from the pause menu.
; ResetOnSuccess : true | false          - recentre the pair after each clear (except the last one).
;                                          The UI def's fadein/fadeout style the transition.
; Textboxes      : show | hide           - show a trial's / lesson's explanatory text, where it has any
; Hints          : true | false          - show a hint once the player has failed hintafter times
; TotalTimer     : true | false          - show the run timer
; TrialTimer     : true | false          - Trials: show the current trial's timer
; LessonTimer    : true | false          - tutorials: show the current lesson's timer

[Modes]
Trials          = 1
GameTutorial    = 1
CharacterGuides = 1
Tutorial        = 1

[Config]
TrialsChar         =
TrialsStage        =
TutorialDummy      =
TutorialPlayerChar =
TutorialStage      =
SystemTutorial     = external/mods/dojo/gametutorial.def
RecordDemo         = false

[Options]
Trials.Advancement      = autoadvance
Trials.Layout           = vertical
Trials.ResetOnSuccess   = false
Trials.Textboxes        = show
Trials.Hints            = true
Trials.TotalTimer       = true
Trials.TrialTimer       = true
Tutorial.Advancement    = autoadvance
Tutorial.Layout         = vertical
Tutorial.ResetOnSuccess = false
Tutorial.Textboxes      = show
Tutorial.Hints          = true
Tutorial.TotalTimer     = true
Tutorial.LessonTimer    = true
